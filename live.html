<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPASS · Live voice demo</title>
  <meta name="description" content="COMPASS adapts while acting. Change your mind mid-task and watch the plan update.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"DM Sans";src:url("/fonts/dm-sans.ttf") format("truetype");font-display:swap;font-weight:100 1000}
    html,body{margin:0;background:#f5f7f2;color:#13211f;font-family:"DM Sans",Arial,sans-serif}
    .live-page{max-width:1180px;margin:0 auto;padding:40px 4.5% 60px}
    .live-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
    .live-head p{margin:0 0 10px;font-size:10px;font-weight:600;letter-spacing:2.1px}

<body>
  <main class="live-page">
    <header class="live-head">
      <div><p>COMPASS · LIVE DEMO</p><h1>It doesn't just answer you.<br><span>It adapts while acting.</span></h1></div>
      <a href="/">Back to COMPASS ↗</a>

    <div id="compass-live-root"></div>

  <script type="module" src="/src/voice/live.tsx"></script>
