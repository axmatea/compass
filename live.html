<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080b">
  <title>COMPASS · Talk to COMPASS</title>
  <meta name="description" content="COMPASS doesn't just answer you. It adapts while acting. Change your mind mid-task and watch the plan update.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Compass;src:url("/fonts/dm-sans.ttf") format("truetype");font-display:swap;font-weight:100 1000}
    html{background:#05080b;color-scheme:dark}
    body{margin:0;min-height:100svh;background:radial-gradient(70% 50% at 50% 0%,#0d1a22 0,transparent 70%),#05080b;color:#f0f5f8;font-family:'Avenir Next',Compass,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .masthead{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:27px 4.5vw;background:linear-gradient(#05080be6,#05080b00);font-size:12px}
    .wordmark{font-size:15px;letter-spacing:.44em;font-weight:500}
    .concept{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.09em;color:#c1cbd1;display:flex;align-items:center;gap:8px}
    .concept i{width:4px;height:4px;border-radius:50%;background:#bedced;box-shadow:0 0 10px #b7e0ff}
    .header-actions{display:flex;gap:28px}
    .header-actions a{opacity:.8}.header-actions a:hover{opacity:1}
    .live-page{max-width:1240px;margin:0 auto;padding:10px 4.5vw 70px}
    .live-head{margin:2vh 0 30px}
    .live-head p{margin:0 0 16px;font-size:10px;letter-spacing:.2em;color:#9fb3bf}
    .live-head h1{margin:0;font-size:clamp(34px,4.6vw,64px);line-height:1.06;letter-spacing:-.035em;font-weight:400}
    .live-head h1 span{color:#8fa9b8}
    .compass-demo .cd-disclosure{color:#8fa2ad}.compass-demo .cd-disclosure-dot{background:#bedced;box-shadow:0 0 8px #b7e0ff}
    @media(max-width:700px){.masthead{padding:20px 6vw}.wordmark{font-size:12px;letter-spacing:.35em}.concept{display:none}.header-actions{gap:16px;font-size:11px}.live-page{padding:4px 4vw 50px}.live-head{margin:0 0 16px}.live-head h1{font-size:clamp(26px,7.4vw,34px)}.live-head p{margin-bottom:10px}}
  </style>
</head>
<body>
  <header class="masthead"><a class="wordmark" href="/" aria-label="COMPASS home">COMPASS</a><span class="concept"><i></i> Live demo</span><nav class="header-actions" aria-label="Site"><a href="/">The story ↗</a><a href="/present.html">Present ↗</a></nav></header>
  <main class="live-page">
    <header class="live-head">
      <p>TALK TO COMPASS</p>
      <h1>It doesn't just answer you.<br><span>It adapts while acting.</span></h1>
    </header>
    <div id="compass-live-root"></div>
  </main>
  <script type="module" src="/src/voice/live.tsx"></script>
</body>
</html>
